<!doctype html>
<html lang="en">
<head>
  <base href="/boo-2026/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Boo 2026</title>
  <meta property="og:title" content="Boo 2026">
  <style>
    :root { --ink: rgba(235, 228, 190, 0.8); --line: rgba(235, 228, 190, 0.22); }
    html, body { margin: 0; height: 100%; background: #0d0e0d; overflow: hidden; font: 13px/1.35 ui-sans-serif, -apple-system, system-ui, sans-serif; color: var(--ink); }
    canvas#c { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: grab; }
    canvas#c:active { cursor: grabbing; }
    #loading { position: fixed; left: 0; right: 0; top: 50%; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    #track { width: min(240px, 60vw); height: 3px; border-radius: 2px; background: rgba(235, 228, 190, 0.16); overflow: hidden; }
    #bar { width: 0; height: 100%; background: #e9dfae; transition: width 0.2s linear; }
    button { font: inherit; color: var(--ink); background: rgba(20, 20, 16, 0.6); border: 1px solid var(--line); cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    #again { position: fixed; left: max(14px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top)); width: 44px; height: 44px; padding: 0; border-radius: 50%; display: grid; place-items: center; }
    #again svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #tilt { position: fixed; right: max(14px, env(safe-area-inset-right)); top: max(14px, env(safe-area-inset-top)); border-radius: 999px; padding: 8px 14px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.4.0/dist/spark.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="loading"><div id="status">Loading</div><div id="track"><div id="bar"></div></div></div>
  <button id="again" aria-label="Play again" title="Play again">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.5 3v5h-5"/></svg>
  </button>
  <button id="tilt" hidden>tilt</button>
  <script type="module" src="./js/boo/main.js"></script>
</body>
</html>
